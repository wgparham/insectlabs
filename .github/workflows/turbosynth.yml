name: turbosynth

on:
  push:
    paths:
      - 'moderne lyfe/tsynth/development/**'
      - '.github/workflows/turbosynth.yml'
  pull_request:
    paths:
      - 'moderne lyfe/tsynth/development/**'
      - '.github/workflows/turbosynth.yml'
  workflow_dispatch:

env:
  PROJECT_DIR: moderne lyfe/tsynth/development

defaults:
  run:
    shell: bash
    working-directory: moderne lyfe/tsynth/development

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TurboSynth-Windows
          - os: macos-latest
            artifact: TurboSynth-macOS
          - os: ubuntu-latest
            artifact: TurboSynth-Linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev libcurl4-openssl-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect
        run: |
          mkdir -p dist
          art=build/src/app/TurboSynth_artefacts/Release
          if [ -d "$art/TurboSynth.app" ]; then cp -R "$art/TurboSynth.app" dist/; else cp "$art"/TurboSynth* dist/; fi
          find build -maxdepth 3 \( -name 'tsynth-cli' -o -name 'tsynth-cli.exe' \) -exec cp {} dist/ \;
          ls -la dist

      # upload-artifact paths are relative to the workspace, not working-directory.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.PROJECT_DIR }}/dist
