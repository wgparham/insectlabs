<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Turbosynth User's Manual</title>
<style>
  @page {
    size: letter;
    margin: 0.8in 0.8in 0.9in 0.8in;
    @bottom-center { content: counter(page); font: 9pt "Century Gothic", "Segoe UI", sans-serif; color: #555; }
  }
  @page cover { margin: 0; @bottom-center { content: none; } }
  @page front { @bottom-center { content: none; } }

  :root { --side: 1.5in; --gap: 0.25in; }
  html { font: 10.5pt/1.45 Georgia, "Times New Roman", serif; color: #111; }
  body { margin: 0; }
  h1, h2, h3, nav, figcaption, .cover, .part-title, .menu, .menupick, table.freq { font-family: "Century Gothic", "Segoe UI", sans-serif; }

  /* Cover */
  .cover { page: cover; height: 11in; background: #000; color: #fff; display: flex; flex-direction: column;
           align-items: center; justify-content: center; text-align: center; break-after: page; position: relative; }
  .cover .logo { width: 5.6in; filter: invert(1); }
  .cover .sub { font-size: 15pt; margin-top: 0.3in; letter-spacing: 0.08em; }
  .cover .icon { width: 1.5in; margin: 0.7in 0 0.6in; border: 1px solid #444; }
  .cover .add { font-size: 11pt; color: #ccc; }
  .cover .maker { font-size: 20pt; margin-top: 0.8in; letter-spacing: 0.04em; font-weight: bold; }
  .cover .note { position: absolute; bottom: 0.5in; font-size: 8pt; color: #999; width: 100%; }

  .front { page: front; break-after: page; font-size: 9pt; }
  .front h2 { font-size: 11pt; margin: 1.2em 0 0.3em; float: none; width: auto; margin-left: 0; }

  /* Contents */
  nav.toc { page: front; break-after: page; columns: 2; column-gap: 0.35in; }
  nav.toc h1 { font-size: 22pt; margin: 0 0 0.25in; column-span: all; }
  nav.toc a { display: block; color: #111; text-decoration: none; break-inside: avoid; }
  nav.toc a.l0 { font-weight: bold; font-size: 10.5pt; margin-top: 0.2in; text-transform: uppercase; letter-spacing: 0.05em; break-after: avoid; }
  nav.toc a.l1 { font-weight: bold; font-size: 9.5pt; margin-top: 0.1in; break-after: avoid; }
  nav.toc a.l2 { font-size: 8.5pt; padding-left: 0.2in; line-height: 1.45; }

  /* Parts and chapters */
  section.part { break-before: page; break-after: page; height: 8.6in; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .part-img { width: 2.6in; margin-bottom: 0.5in; }
  .part-title { font-size: 26pt; text-align: center; border-top: 2px solid #111; border-bottom: 2px solid #111; padding: 0.2in 0.4in; margin: 0; }
  section.chapter { break-before: page; padding-left: calc(var(--side) + var(--gap)); }
  section.chapter > h1 { font-size: 21pt; margin: 0 0 0.35in calc(-1 * (var(--side) + var(--gap)));
                          padding-bottom: 0.08in; border-bottom: 2px solid #111; }

  /* Side headings, as in the original layout */
  h2 { float: left; clear: left; width: var(--side); margin: 0.1em 0 0.4em calc(-1 * (var(--side) + var(--gap)));
       font-size: 10.5pt; line-height: 1.25; font-weight: bold; break-after: avoid; }
  h3 { font-size: 10.5pt; margin: 1em 0 0.3em; break-after: avoid; }
  p { margin: 0 0 0.75em; text-align: left; hyphens: auto; orphans: 2; widows: 2; }
  ul, ol { margin: 0 0 0.75em; padding-left: 1.3em; }
  li { margin-bottom: 0.35em; }
  aside { border-left: 3px solid #111; padding: 0.05in 0.12in; margin: 0.15in 0; background: #f2f2f2; font-size: 10pt; break-inside: avoid; }
  figure { margin: 0.12in 0 0.18in; break-inside: avoid; clear: right; }
  figure img { display: block; max-width: 100%; }
  figcaption { font-size: 8.5pt; color: #444; margin-top: 0.05in; font-style: italic; }
  figure.icon { float: left; clear: left; width: var(--side); margin: 0.05in 0 0.1in calc(-1 * (var(--side) + var(--gap)));
                display: flex; justify-content: flex-end; }
  h2 + figure.icon { margin-top: 0.4in; }

  /* Macintosh menus, redrawn */
  .menupick { float: left; clear: left; width: var(--side); margin: 0.05in 0 0.15in calc(-1 * (var(--side) + var(--gap)));
              font-size: 8pt; font-weight: bold; }
  .menupick .mtitle { display: inline-block; background: #111; color: #fff; padding: 1px 6px; }
  .menupick .mitem { display: block; background: #111; color: #fff; padding: 2px 6px; margin-top: 3px; border: 1px solid #111; box-shadow: 2px 2px 0 #999; }
  .menu { margin: 0.05in 0 0.2in; font-size: 8.5pt; font-weight: bold; break-inside: avoid; display: inline-block; }
  .menu .mtitle { display: inline-block; background: #111; color: #fff; padding: 1px 8px; }
  .menu table { border-collapse: collapse; border: 1px solid #111; box-shadow: 2px 2px 0 #111; background: #fff; }
  .menu td { padding: 1px 6px; border: 0; white-space: nowrap; }
  .menu td.mk { width: 0.8em; padding-right: 0; }
  .menu td.key { text-align: right; padding-left: 1.2em; }
  .menu tr.dim td { color: #999; font-weight: normal; }
  .menu tr.sep td { padding: 0; border-top: 1px dotted #777; height: 3px; }

  /* Note-to-frequency chart */
  table.freq { border-collapse: collapse; font-size: 8.5pt; margin: 0.1in 0 0 calc(-1 * (var(--side) + var(--gap))); width: calc(100% + var(--side) + var(--gap)); }
  table.freq th, table.freq td { border: 1px solid #999; padding: 1px 6px; }
  table.freq th { background: #111; color: #fff; font-weight: bold; }
  table.freq td:nth-child(odd) { font-weight: bold; }
  table.freq td:nth-child(even) { text-align: right; }
  table.freq td:nth-child(2), table.freq td:nth-child(4) { border-right: 2px solid #111; }
  table.freq tbody tr:nth-child(12n+1) td { border-top: 2px solid #111; }
</style>
</head>
<body>

<div class="cover">
  <img class="logo" src="cover/cover_logo.png" alt="TURBOSYNTH">
  <div class="sub">USER'S MANUAL · VERSION 2.0</div>
  <img class="icon" src="cover/cover_icon.png" alt="">
  <div class="add">with the Turbosynth SC 2.2 Manual Addendum</div>
  <div class="maker">digidesign</div>
  <div class="note">Re-typeset reference edition of the original Digidesign manuals (1989; addendum 1993).</div>
</div>

{{FRONT}}

{{TOC}}

{{BODY}}

</body>
</html>
